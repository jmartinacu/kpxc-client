name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "kpxc-client ${GITHUB_REF_NAME}" \
            --generate-from-commit \
            --verify-tag

  upload-assets:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          go build -trimpath -ldflags "-s -w" \
            -o "kpxc-client_${GOOS}_${GOARCH}" .

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "${GITHUB_REF_NAME}" \
            "kpxc-client_${GOOS}_${GOARCH}" --clobber
